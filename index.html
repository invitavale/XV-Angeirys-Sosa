<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Regalos · XV Angeirys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --mauve: #9C6A72; --mauve-light: #C9A0A6; --blush: #F3E5E6;
    --cream: #FFF9F2; --text: #5A4346; --muted: #8A7376;
    --ok: #4F7A4F; --danger: #B23A48; --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--cream); color: var(--text);
    min-height: 100vh; padding: 16px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-family: 'Playfair Display', serif; color: var(--mauve); font-size: 1.7rem; text-align: center; margin: 12px 0 4px; }
  .sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 20px; }

  /* Login */
  .login { background: var(--card); border-radius: 20px; padding: 28px 20px; max-width: 360px; margin: 40px auto 0;
           box-shadow: 0 10px 30px -14px rgba(90,67,70,.4); text-align: center; }
  .login p { color: var(--muted); font-size: .92rem; margin-bottom: 16px; }
  .login input { width: 100%; font: inherit; font-size: 22px; letter-spacing: .4em; text-align: center;
                 padding: 12px; border: 1.5px solid var(--mauve-light); border-radius: 14px; background: var(--cream); color: var(--text); }
  .login input:focus { outline: none; border-color: var(--mauve); }
  .btn { border: none; cursor: pointer; font: inherit; font-weight: 600; border-radius: 999px; }
  .btn-main { width: 100%; margin-top: 14px; padding: 13px; background: linear-gradient(90deg, var(--mauve), var(--mauve-light)); color: #fff; font-size: 1rem; }
  .btn-main:disabled { opacity: .5; cursor: default; }
  .err { color: var(--danger); font-size: .88rem; margin-top: 10px; min-height: 1.2em; }

  /* Panel */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border-radius: 16px; padding: 14px 8px; text-align: center; box-shadow: 0 6px 18px -12px rgba(90,67,70,.45); }
  .stat b { display: block; font-size: 1.6rem; color: var(--mauve); }
  .stat span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; background: var(--blush); padding: 4px; border-radius: 999px; }
  .tab { padding: 8px 14px; background: transparent; color: var(--mauve); font-size: .85rem; }
  .tab.on { background: var(--card); box-shadow: 0 2px 8px -4px rgba(90,67,70,.5); }
  .tools { display: flex; gap: 6px; }
  .tool { padding: 8px 14px; background: var(--card); color: var(--mauve); border: 1.5px solid var(--mauve-light); font-size: .85rem; }
  .updated { font-size: .78rem; color: var(--muted); text-align: right; margin-bottom: 8px; }

  .list { display: grid; gap: 10px; }
  .pic { position: relative; width: 84px; height: 84px; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--blush); }
  .pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pic .num { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; font-size: .72rem; }
  .row.taken .pic img { opacity: .9; }
  .row { background: var(--card); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center;
         box-shadow: 0 6px 18px -14px rgba(90,67,70,.5); border-left: 4px solid transparent; }
  .row.taken { border-left-color: var(--mauve); }
  .num { width: 34px; height: 34px; border-radius: 50%; background: var(--blush); color: var(--mauve); font-weight: 600; font-size: .85rem;
         display: flex; align-items: center; justify-content: center; }
  .title { font-weight: 600; font-size: .95rem; }
  .detail { font-size: .8rem; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .who { margin-top: 6px; font-size: .9rem; }
  .who strong { color: var(--mauve); }
  .who small { color: var(--muted); display: block; font-size: .76rem; margin-top: 1px; }
  .free { margin-top: 6px; font-size: .82rem; color: var(--ok); font-weight: 500; }
  .release { padding: 8px 12px; background: transparent; color: var(--danger); border: 1.5px solid #E5B9BF; font-size: .8rem; white-space: nowrap; }
  .release.sure { background: var(--danger); color: #fff; border-color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .logout { display: block; margin: 22px auto 10px; background: transparent; color: var(--muted); font-size: .85rem; text-decoration: underline; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120%); background: #2b2224; color: #fff;
           padding: 12px 18px; border-radius: 12px; font-size: .9rem; transition: transform .3s; z-index: 10; max-width: calc(100% - 32px); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    .row { grid-template-columns: 76px 1fr; }
    .pic { width: 76px; height: 76px; }
    .row .release { grid-column: 2; justify-self: start; }
    .bar { flex-direction: column; align-items: stretch; }
    .tabs { justify-content: space-between; }
    .tab { flex: 1; padding: 8px 6px; }
    .tools { justify-content: flex-end; }
  }
</style>
</head>

<div class="wrap">
  <h1>Mesa de Regalos</h1>
  <p class="sub">XV Años de Angeirys Estheisy Sosa · ¿Quién eligió qué?</p>

  <!-- Acceso con PIN -->
  <form class="login" id="login" autocomplete="off" hidden>

    <div class="stats">

    <div class="bar">
      <div class="tabs" role="tablist">

        <button class="btn tab" data-f="free" type="button">Disponibles</button>
      </div>
      <div class="tools">
        <button class="btn tool" id="refresh" type="button">Actualizar</button>
      </div>
    </div>
    <p class="updated" id="updated"></p>
    <div class="list" id="list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

  const $ = (id) => document.getElementById(id);
  let pin = '';
  let claims = {};     // item_id -> {guest_name, created_at}
  let filter = 'all';
  let pendingRelease = null;

  function store(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
  }

  async function rpc(fn, body) {
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const tm = ctrl ? setTimeout(() => ctrl.abort(), 8000) : null;
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined,
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (tm) clearTimeout(tm);
    if (!r.ok) throw new Error(fn + ' ' + r.status);
    return r.json();
  }

  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleString('es-DO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  async function fetchClaims() {
    const r = await rpc('admin_get_gift_claims', { p_event: EVENT, p_pin: pin });
    if (!r || !r.ok) return false;
    claims = {};
    (r.claims || []).forEach(c => { claims[c.item_id] = c; });
    return true;
  }

  function render() {
    const takenIds = ITEMS.filter(i => claims[i[0]]);
    const people = new Set(Object.values(claims).map(c => (c.guest_name || '').trim().toLowerCase()).filter(Boolean));
    $('sTaken').textContent = takenIds.length;
    $('sFree').textContent = ITEMS.length - takenIds.length;
    $('sPeople').textContent = people.size;
    $('updated').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-DO', { hour: 'numeric', minute: '2-digit' });

    const list = $('list'); list.innerHTML = '';
    const rows = ITEMS.filter(([id]) => filter === 'all' || (filter === 'taken' ? claims[id] : !claims[id]));
    if (!rows.length) {
      list.innerHTML = '<p class="empty">' + (filter === 'taken' ? 'Todavía nadie ha reservado regalos.' : 'Todos los regalos están reservados.') + '</p>';
      return;
    }
    rows.forEach(([id, title, detail]) => {
      const n = ITEMS.findIndex(i => i[0] === id) + 1;
      const c = claims[id];
      const row = document.createElement('div');
      row.className = 'row' + (c ? ' taken' : '');
      row.innerHTML = '<div class="pic"><img alt="" src="' + IMGS[id] + '"><span class="num">' + n + '</span></div><div><div class="title"></div><div class="detail"></div>' +
        (c ? '<div class="who">Lo regala <strong></strong><small></small></div>' : '<div class="free">Disponible</div>') + '</div>';
      row.querySelector('.title').textContent = title;
      row.querySelector('.detail').textContent = detail;
      if (c) {
        row.querySelector('.who strong').textContent = c.guest_name || 'Sin nombre';
        row.querySelector('.who small').textContent = fmtDate(c.created_at);
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn release' + (pendingRelease === id ? ' sure' : '');
        b.textContent = pendingRelease === id ? '¿Seguro? Toca otra vez' : 'Liberar';
        b.addEventListener('click', () => release(id));
        row.appendChild(b);
      }
      list.appendChild(row);
    });
  }

  async function refresh(silent) {
    try {
      const ok = await fetchClaims();
      if (!ok) { toast('No se pudo cargar la lista.'); return; }
      render();
      if (!silent) toast('Lista actualizada');
    } catch (e) { toast('Sin conexión. Inténtalo de nuevo.'); }
  }

  async function release(id) {
    if (pendingRelease !== id) {
      pendingRelease = id; render();
      setTimeout(() => { if (pendingRelease === id) { pendingRelease = null; render(); } }, 4000);
      return;
    }
    pendingRelease = null;
    try {
      const r = await rpc('admin_release_gift', { p_event: EVENT, p_pin: pin, p_item_id: id });
      if (!r || !r.ok) throw new Error('release');
      toast('Regalo liberado: vuelve a estar disponible');
      await refresh(true);
    } catch (e) { toast('No se pudo liberar. Inténtalo de nuevo.'); render(); }
  }

  function copyList() {
    const lines = ['🎁 Mesa de regalos · XV Angeirys', ''];
    ITEMS.forEach(([id, title], i) => {
      const c = claims[id];
      lines.push((i + 1) + '. ' + title + ' — ' + (c ? (c.guest_name || 'Sin nombre') : 'Disponible'));
    });
    const text = lines.join('\n');
    const done = () => toast('Lista copiada para WhatsApp');
    const fallback = () => {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); done();
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallback);
    else fallback();
  }

  function logout() {
    pin = ''; store('xv_ang_pin', null);
    $('panel').hidden = true; $('login').hidden = false; $('pin').value = '';
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const v = $('pin').value.trim();
    if (!v) return;
    $('enter').disabled = true; $('loginErr').textContent = '';
    pin = v;
    try {
      const ok = await fetchClaims();
      if (!ok) { $('loginErr').textContent = 'PIN incorrecto.'; pin = ''; }
      else { store('xv_ang_pin', pin); $('login').hidden = true; $('panel').hidden = false; render(); }
    } catch (err) { $('loginErr').textContent = 'No hay conexión. Inténtalo de nuevo.'; pin = ''; }
    $('enter').disabled = false;
  });

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    filter = t.dataset.f; render();
  }));
  $('refresh').addEventListener('click', () => refresh(false));

  // Recarga sola cada 30 s mientras está abierta
  setInterval(() => { if (pin && !document.hidden) refresh(true); }, 30000);

  // Entrada directa, sin pedir PIN: la lista se muestra completa al instante
  // y luego se rellenan las reservas (con reintentos si la conexión falla).
  async function boot() {
    pin = ADMIN_PIN;
    $('login').hidden = true;
    $('panel').hidden = false;
    render();
    $('updated').textContent = 'Cargando reservas…';
    for (let i = 0; i < 4; i++) {
      try {
        const ok = await fetchClaims();
        if (ok) { render(); return; }
      } catch (e) {}
      await new Promise(r => setTimeout(r, 800 * (i + 1)));
    }
    $('updated').textContent = 'No se pudieron cargar las reservas. Toca “Actualizar”.';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
